name: pokedata-prod

# Shared Airflow environment (values come from the repo-root .env file).
# Production secrets use the `${VAR:?msg}` form: startup fails loudly if unset.
x-airflow-env: &airflow-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_service:${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD must be set}@postgres:5432/airflow_meta
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  # Airflow 3: LocalExecutor task workers reach the Execution API on the api-server.
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY must be set}
  # Shared JWT secret — the scheduler signs Execution API tokens the api-server
  # validates, so BOTH need the same value.
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET must be set}
  # The DAG lives at /opt/airflow/src/dags (image COPY of src/); no bind mount here.
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/src/dags

services:
  postgres:
    container_name: pokedata-postgres
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      APP_READER_PASSWORD: ${APP_READER_PASSWORD:?APP_READER_PASSWORD must be set}
      APP_WRITER_PASSWORD: ${APP_WRITER_PASSWORD:?APP_WRITER_PASSWORD must be set}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD must be set}
    volumes:
      # postgres:18+ stores data in a versioned subdir, so the volume mounts at
      # /var/lib/postgresql (not /var/lib/postgresql/data).
      - postgres_data:/var/lib/postgresql
      - ../database/initdb/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ../database:/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:?POSTGRES_DB must be set}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    mem_limit: 1g

  app-migrate:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      APP_READER_PASSWORD: ${APP_READER_PASSWORD:?APP_READER_PASSWORD must be set}
      APP_WRITER_PASSWORD: ${APP_WRITER_PASSWORD:?APP_WRITER_PASSWORD must be set}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD must be set}
    volumes:
      - ../database:/database:ro
    command: ["sh", "/database/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    container_name: pokedata-app
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    image: pokedata-app:latest
    environment:
      DATABASE_URL: postgresql+psycopg2://pokemon_reader:${APP_READER_PASSWORD:?APP_READER_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      APP_ENV: prod
      API_BASE_URL: ${API_BASE_URL:-https://pokeapi.co/api/v2}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-20}
      API_CONCURRENCY: ${API_CONCURRENCY:-8}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Project-local raw-JSON cache (bind mount) at <repo>/cache.
      - ../cache/prod:/app/cache
    command: gunicorn src.main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --workers 2
    depends_on:
      app-migrate:
        condition: service_completed_successfully
    restart: always
    mem_limit: 512m
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  airflow-scheduler:
    container_name: pokedata-airflow-scheduler
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    image: pokedata-airflow:latest
    environment:
      <<: *airflow-env
      DATABASE_URL: postgresql+psycopg2://pokemon_writer:${APP_WRITER_PASSWORD:?APP_WRITER_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      APP_ENV: prod
      API_BASE_URL: ${API_BASE_URL:-https://pokeapi.co/api/v2}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-20}
      API_CONCURRENCY: ${API_CONCURRENCY:-8}
    volumes:
      - airflow_logs:/opt/airflow/logs
      # Project-local raw-JSON cache (bind mount) at <repo>/cache.
      - ../cache/prod:/opt/airflow/cache
    command: airflow scheduler
    depends_on:
      app-migrate:
        condition: service_completed_successfully
      airflow-init:
        condition: service_completed_successfully
    restart: always
    # LocalExecutor runs task processes here; pandas/numpy ETL tasks need headroom.
    mem_limit: 2g

  # Airflow 3: DAG parsing is a separate component — without it, no DAGs appear.
  airflow-dag-processor:
    container_name: pokedata-airflow-dag-processor
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    image: pokedata-airflow:latest
    environment:
      <<: *airflow-env
    volumes:
      - airflow_logs:/opt/airflow/logs
    command: airflow dag-processor
    depends_on:
      app-migrate:
        condition: service_completed_successfully
      airflow-init:
        condition: service_completed_successfully
    restart: always
    mem_limit: 512m

  airflow-webserver:
    container_name: pokedata-airflow-webserver
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    image: pokedata-airflow:latest
    environment:
      <<: *airflow-env
      # JWT secret comes from the shared anchor. API session secret + base url (webserver-only):
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET must be set}
      AIRFLOW__API__BASE_URL: ${AIRFLOW_BASE_URL:-http://localhost:8080}
    volumes:
      - airflow_logs:/opt/airflow/logs
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    # Airflow 3: `airflow webserver` is replaced by `airflow api-server`.
    command: airflow api-server
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-init:
    container_name: pokedata-airflow-init
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    image: pokedata-airflow:latest
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD must be set}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Admin}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-User}
      MIRROR_POOL_SLOTS: ${MIRROR_POOL_SLOTS:-1}
    depends_on:
      app-migrate:
        condition: service_completed_successfully
    # Airflow 3: migrate the metadata DB (`db migrate`, replaces `db init`) and
    # create the admin user via the FAB provider. Admin password is required
    # (no insecure default); `|| true` keeps re-running init idempotent.
    command: ["bash", "/opt/airflow/airflow-init.sh"]

  streamlit:
    container_name: pokedata-streamlit
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    image: pokedata-app:latest
    command: streamlit run src/analytics/dashboard.py
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    environment:
      DATABASE_URL: postgresql+psycopg2://pokemon_reader:${APP_READER_PASSWORD:?APP_READER_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      APP_ENV: prod
    depends_on:
      app-migrate:
        condition: service_completed_successfully
    restart: always
    mem_limit: 512m

volumes:
  postgres_data:
  airflow_logs:
