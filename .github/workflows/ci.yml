name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so a secret in any commit is caught
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan repository history
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  gate:
    name: Lint / type / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
      - name: Sync dependencies
        run: uv sync --all-extras --locked
      - name: Check Airflow image and hashed requirements match the lockfile
        run: python3 docker/sync_airflow_pins.py --check
      - name: Ruff lint + format check
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Mypy
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest -q
      - name: Validate both Compose plans with dummy credentials
        env:
          POSTGRES_PASSWORD: DummyPassword1234567890
          APP_READER_PASSWORD: DummyPassword1234567890
          APP_WRITER_PASSWORD: DummyPassword1234567890
          AIRFLOW_DB_PASSWORD: DummyPassword1234567890
          AIRFLOW_FERNET_KEY: DummyFernet
          AIRFLOW_JWT_SECRET: DummyJwt
          AIRFLOW_ADMIN_PASSWORD: DummyPassword1234567890
        run: |
          docker compose -f docker/docker-compose.dev.yml --env-file .env.example config --quiet
          docker compose -f docker/docker-compose.prod.yml --env-file .env.example config --quiet
      - name: Build Python distributions
        run: uv build
      - name: Build application image and check for local secrets
        run: |
          echo 'DUMMY_IMAGE_SENTINEL=must-not-be-in-image' > .env
          docker build -f docker/Dockerfile.app -t pokedata-app:ci .
          docker run --rm --entrypoint test pokedata-app:ci ! -e /app/.env
      - name: Build Airflow image
        run: |
          docker build -f docker/Dockerfile.airflow -t pokedata-airflow:ci .
          docker run --rm --entrypoint python pokedata-airflow:ci -c \
            'from src.dags.pokeapi_mirror import dag; assert len(dag.tasks) == 48'

  database-integration:
    name: PostgreSQL fresh/upgrade migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: DummyPassword1234567890
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: DummyPassword1234567890
      APP_READER_PASSWORD: DummyReaderPassword1234567890
      APP_WRITER_PASSWORD: DummyWriterPassword1234567890
      AIRFLOW_DB_PASSWORD: DummyAirflowPassword1234567890
      POKEDATA_CI_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Verify fresh and forward migrations with role grants
        run: uv run pytest -q tests/test_postgres_migrations.py

  dependency-audit:
    name: Runtime dependency advisory report
    runs-on: ubuntu-latest
    continue-on-error: true # Existing findings in AUDIT-DEP-001 need coordinated upgrades.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
      - name: Audit frozen runtime resolution
        run: |
          uv export --locked --all-extras --no-dev --no-emit-project --no-hashes -o /tmp/pokedata-requirements.txt
          uvx --from pip-audit pip-audit -r /tmp/pokedata-requirements.txt --no-deps --disable-pip --progress-spinner off
